[project]
name = "maaplus"
version = "0.1.0"
description = "A code-first lightweight enhancement layer for MaaFramework"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "maafw>=5.12.3",
]

[project.optional-dependencies]
studio = ["Pillow>=10.4"]
dev = ["pytest>=8.3"]

[project.scripts]
maaplus-studio = "maaplus_studio.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maaplus", "maaplus.*", "maaplus_studio", "maaplus_studio.*"]
