[project]
name = "maaplus-studio"
version = "0.1.0"
description = "A local UI authoring studio for MaaPlus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "maaplus[dev]>=1.4.0,<2",
    "maafw>=5.13.1,<6",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.53.0,<0.54",
    "pydantic>=2.13.5,<3",
]

[project.scripts]
maaplus-studio = "maaplus_studio.cli:main"

[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maaplus_studio"]

[tool.hatch.build]
artifacts = ["src/maaplus_studio/web/**"]

[tool.uv.sources]
maaplus = { path = "..", editable = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
