name: Workbench final build

on:
  push:
    branches:
      - redesign/ui-workbench-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate
      - name: Install
        working-directory: tools/frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: tools/frontend
        run: pnpm build
      - name: Commit bundle
        run: |
          if git diff --quiet -- tools/ui_workbench.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ui_workbench.html
          git commit -m "chore(workbench): rebuild final light bundle [skip ci]"
          git push
