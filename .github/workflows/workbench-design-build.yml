name: Workbench design build

on:
  push:
    branches:
      - redesign/ui-workbench-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply workspace shell treatment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/frontend/src/App.tsx')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'className="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 overflow-hidden font-sans select-none"',
                  'className="flex flex-col h-screen w-screen bg-[#f5f5f2] text-[#191918] overflow-hidden font-sans select-none"',
              ),
              (
                  'className="flex-1 flex overflow-hidden relative"',
                  'className="flex-1 flex overflow-hidden relative bg-[#f5f5f2] p-3"',
              ),
              (
                  'className="w-72 shrink-0 h-full"',
                  'className="w-72 shrink-0 h-full mr-3 ds-panel overflow-hidden"',
              ),
              (
                  'className="flex-1 flex flex-col h-full overflow-hidden"',
                  'className="flex-1 flex flex-col h-full overflow-hidden ds-panel"',
              ),
              (
                  'className="w-84 shrink-0 h-full"',
                  'className="w-84 shrink-0 h-full ml-3 ds-panel overflow-hidden"',
              ),
              (
                  'className="fixed bottom-12 right-6 z-50 bg-slate-900/95 border border-sky-500/50 text-sky-200 text-xs px-4 py-2.5 rounded-lg shadow-2xl backdrop-blur-md animate-in fade-in slide-in-from-bottom-2 duration-150 flex items-center space-x-2"',
                  'className="fixed bottom-6 right-6 z-50 bg-white border border-[#deded9] text-[#343431] text-[11px] px-4 py-2.5 rounded-xl shadow-[0_10px_35px_rgba(20,20,18,0.12)] animate-in fade-in slide-in-from-bottom-2 duration-150 flex items-center space-x-2"',
              ),
              (
                  'className="w-2 h-2 rounded-full bg-sky-400 animate-pulse"',
                  'className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected App.tsx fragment not found: {old}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate

      - name: Install frontend dependencies
        working-directory: tools/frontend
        run: pnpm install --frozen-lockfile

      - name: Build workbench bundle
        working-directory: tools/frontend
        run: pnpm build

      - name: Commit generated shell and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/frontend/src/App.tsx tools/ui_workbench.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "style(workbench): apply dashboard shell and rebuild bundle [skip ci]"
          git push
