name: Workbench fix validation

on:
  push:
    branches:
      - redesign/ui-workbench-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Workbench backend tests
        run: python -m pytest tests/test_workbench.py tests/test_workbench_device_fallback.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate

      - name: Install frontend dependencies
        working-directory: tools/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        working-directory: tools/frontend
        run: pnpm build

      - name: Sync generated Workbench bundle
        run: |
          if git diff --quiet -- tools/ui_workbench.html; then
            echo "Workbench bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ui_workbench.html
          git commit -m "chore(workbench): rebuild device-fix bundle [skip ci]"
          git push
