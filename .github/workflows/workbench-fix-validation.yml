name: Workbench fix validation

on:
  push:
    branches:
      - redesign/ui-workbench-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Workbench backend tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_workbench.py tests/test_workbench_device_fallback.py -vv > workbench-test.log 2>&1
          echo $? > workbench-test.status
          cat workbench-test.log
          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate

      - name: Install frontend dependencies
        working-directory: tools/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        shell: bash
        run: |
          set +e
          pnpm --dir tools/frontend build > workbench-build.log 2>&1
          echo $? > workbench-build.status
          cat workbench-build.log
          exit 0

      - name: Sync bundle and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ui_workbench.html workbench-test.log workbench-build.log workbench-test.status workbench-build.status
          if ! git diff --cached --quiet; then
            git commit -m "chore(workbench): capture validation output [skip ci]"
            git push
          fi

      - name: Enforce validation result
        run: |
          test "$(cat workbench-test.status)" = "0"
          test "$(cat workbench-build.status)" = "0"
