name: Workbench v2 build

on:
  push:
    branches:
      - redesign/ui-workbench-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate
          pnpm --version

      - name: Install frontend dependencies
        working-directory: tools/frontend
        run: pnpm install --frozen-lockfile

      - name: Build single-file workbench
        working-directory: tools/frontend
        run: pnpm build

      - name: Commit generated workbench bundle
        run: |
          if git diff --quiet -- tools/ui_workbench.html; then
            echo "Workbench bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ui_workbench.html
          git commit -m "chore(workbench): rebuild single-file bundle [skip ci]"
          git push
